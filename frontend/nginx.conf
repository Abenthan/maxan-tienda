events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # DNS embebido de Docker: necesario porque el `auth_request` de /producto/:id
    # construye el proxy_pass con una variable (el id) y nginx resuelve el
    # upstream en tiempo de petición, no al arrancar.
    resolver 127.0.0.11 valid=10s;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        client_max_body_size 10M;

        # Cabeceras de seguridad (HTTPS lo resuelve Caddy delante).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # API de la tienda (Express) — el frontend consume /api con el mismo origen.
        location /api/ {
            proxy_pass http://tienda-backend:3007/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            set $forwarded_proto $scheme;
            if ($http_x_forwarded_proto) {
                set $forwarded_proto $http_x_forwarded_proto;
            }
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 90s;
        }

        # Healthcheck del backend (lo usa deploy.sh).
        location = /health {
            proxy_pass http://tienda-backend:3007/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ficha de producto: 404 real cuando el id no existe en el catálogo.
        # `auth_request` consulta al backend; 200 = existe, 403 = no existe.
        # El 403 se convierte en 404 sirviendo igualmente el body de la SPA
        # (React muestra su estado "producto no encontrado"). Si el backend
        # falla, se sirve la SPA con 200 y es el cliente quien muestra el error.
        location ~ ^/producto/(?<idp>[0-9]+)/?$ {
            set $producto_id $idp;
            auth_request /_existe_producto;
            error_page 403 =404 /index.html;
            error_page 500 502 503 504 =200 /index.html;
            try_files /index.html =404;
        }

        location = /_existe_producto {
            internal;
            proxy_pass http://tienda-backend:3007/api/catalogo/productos/$producto_id/existe;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Ids malformados (/producto/abc, /producto/1/x, /producto) y rutas
        # /producto/* que no sean numéricas: 404 real con el body de la SPA.
        location ~ ^/producto(?:/|$) {
            try_files $uri $uri/ =404;
            error_page 404 =404 /index.html;
        }

        # index.html nunca se cachea: es quien apunta a los bundles con hash.
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            expires -1;
        }

        # Los assets de Vite llevan hash en el nombre: se cachean un año.
        location ^~ /assets/ {
            expires 1y;
        }

        # Imágenes, fuentes e iconos: cache largo pero revalidable.
        location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
            expires 30d;
        }

        # Archivos que siempre deben estar frescos.
        location = /robots.txt {
            expires -1;
        }

        location = /sitemap.xml {
            expires -1;
        }

        location = /site.webmanifest {
            default_type application/manifest+json;
            expires -1;
        }

        # SPA fallback (React + Vite): las rutas del cliente (/producto/:id,
        # /carrito, /cotizaciones) devuelven index.html y las resuelve el router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
