# ============================================================
# maxan-tienda — DESARROLLO
# Levanta backend (nodemon) + frontend (Vite HMR) con un solo comando.
# La BD es la del ERP (maxan_db_dev) → ver .env.dev
#
# Uso:
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up
#   - Backend:  http://localhost:3007/health
#   - Frontend: http://localhost:5178
# ============================================================
services:
  tienda-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: maxan-tienda-backend-dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: .env.dev
    environment:
      DB_HOST: ${DB_HOST:?Define DB_HOST en .env.dev}
      DB_PORT: ${DB_PORT:?Define DB_PORT en .env.dev}
      NODE_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3007:3007"

  tienda-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: maxan-tienda-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5178:5178"
    depends_on:
      - tienda-backend
